[package]
name = "unswiper-takeout"
description = "Google Takeout import for Unswiper: safe, resumable unpacking of Google Photos archives and JSON sidecar matching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
unswiper-core = { path = "../unswiper-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "1"
# Archive formats Google Takeout produces: .zip (deflate) and .tgz (tar + gzip).
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"

[target.'cfg(unix)'.dependencies]
# Free space on the destination disk (statvfs).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile = "3"
