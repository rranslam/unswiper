[package]
name = "unswiper-cli"
description = "Command-line front end to unswiper-core (index, groups, commit --dry-run, restore)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "unswiper-cli"
path = "src/main.rs"

[dependencies]
unswiper-core = { path = "../unswiper-core" }
unswiper-takeout = { path = "../unswiper-takeout" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
