<!-- Unswiper app icon: photos go into a funnel, one keeper comes out. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- two incoming photos -->
  <g transform="rotate(-12 38 22)">
    <rect x="16" y="6" width="44" height="34" rx="6" fill="#f6f5f4" stroke="#5e5c64" stroke-width="4"/>
    <rect x="23" y="13" width="30" height="20" rx="2" fill="#99c1f1"/>
  </g>
  <g transform="rotate(12 90 22)">
    <rect x="68" y="6" width="44" height="34" rx="6" fill="#f6f5f4" stroke="#5e5c64" stroke-width="4"/>
    <rect x="75" y="13" width="30" height="20" rx="2" fill="#99c1f1"/>
  </g>
  <!-- funnel -->
  <path d="M6 46 L122 46 L78 84 L78 96 L50 96 L50 84 Z" fill="#c64600"/>
  <path d="M6 42 L122 42 L78 80 L78 92 L50 92 L50 80 Z" fill="#ff7800"/>
  <rect x="6" y="40" width="116" height="9" rx="4.5" fill="#ffa348"/>
  <!-- keeper photo -->
  <rect x="22" y="92" width="62" height="34" rx="7" fill="#1a5fb4"/>
  <rect x="22" y="90" width="62" height="34" rx="7" fill="#3584e4"/>
  <path d="M22 116 L40 100 L52 110 L60 104 L84 120 L84 117 Q84 124 77 124 L29 124 Q22 124 22 117 Z" fill="#99c1f1"/>
  <!-- keep badge -->
  <circle cx="100" cy="104" r="23" fill="#26a269"/>
  <circle cx="100" cy="101" r="23" fill="#2ec27e"/>
  <path d="M88 101 L97 110 L112 93" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
