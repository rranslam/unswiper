# On a v* tag: build the Mac dmg (ad-hoc signed), the AppImages and the Flatpak bundles (x86_64 and
# aarch64), then attach all five to the GitHub release for that tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build Unswiper.dmg
        run: apps/macos/scripts/build-dmg.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: Unswiper-dmg
          path: apps/macos/dist/Unswiper-*.dmg
          if-no-files-found: error

  appimage:
    uses: ./.github/workflows/appimage.yml

  flatpak:
    uses: ./.github/workflows/flatpak.yml

  release:
    needs: [build-dmg, appimage, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files
        run: |
          mkdir out
          cp dist/Unswiper-dmg/*.dmg out/
          for a in x86_64 aarch64; do
            cp "dist/Unswiper-$a.AppImage/Unswiper-$a.AppImage" out/
            cp "dist/Unswiper-$a.flatpak/Unswiper-$a.flatpak" out/
          done
          ls -l out
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
