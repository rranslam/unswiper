name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build Unswiper.dmg
        run: apps/macos/scripts/build-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/macos/dist/Unswiper-*.dmg
          generate_release_notes: true
