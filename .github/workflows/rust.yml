# Rust crates — lint, test, coverage gate (plan §10.8: 85% core).
# unswiper-gtk targets the Ubuntu 24.04 LTS feature level: GTK 4.14, libadwaita 1.5 (GNOME 46).
name: Rust

on:
  push:
    branches: ["main", "phase*"]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always
  # Folder dates and titles are local-time; pin a zone with DST so tests are deterministic.
  TZ: America/Los_Angeles

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: GTK 4 / libadwaita / libheif headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libheif-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GTK 4 / libadwaita / libheif headers, GStreamer, Xvfb for the GUI tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libheif-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav xvfb xauth
      # xvfb-run gives the headless smoke test (crates/unswiper-gtk/tests/smoke.rs) a display.
      - run: xvfb-run -a cargo test --workspace
        env:
          PROPTEST_CASES: "256"
      - name: Also pass in UTC
        run: xvfb-run -a cargo test --workspace
        env:
          TZ: UTC

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: GTK 4 / libadwaita / libheif headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libheif-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Core coverage (gate 85% lines)
        run: cargo llvm-cov --package unswiper-core --fail-under-lines 85 --summary-only
      # Approved exclusion (Rob, 2026-10-14): the relm4 widget layer (ui.rs, main.rs) needs a display
      # and is covered by the xvfb smoke test, not line coverage. All GUI logic lives in
      # state/help/thumbs/format/icons and is counted.
      - name: Workspace coverage (gate 80% lines)
        run: cargo llvm-cov --workspace --ignore-filename-regex 'unswiper-gtk/src/(ui|main)\.rs' --fail-under-lines 80 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
